 const n=deck.length,kc=D.filter((d,k)=>(grp==0||d[0]==grp)&&known.has(k)).length,tot=D.filter(d=>grp==0||d[0]==grp).length;
 let h=chips()+`<div class="row"><button id="un" class="${onlyUnk?'on':''}">Only unknown</button><button id="sf">Shuffle</button><span class="mu" style="margin-left:auto">Known ${kc}/${tot}</span></div>`;
 if(!n){app.innerHTML=h+`<div class="card" style="cursor:default"><div class="wd">All known 🎉</div></div>`;bindChips();bindF();return}
 const k=deck[i],d=D[k];
 h+=`<div class="mu">${i+1} / ${n}</div><div class="bar"><i style="width:${(i+1)/n*100}%"></i></div>
 <div class="card" id="cd">${flip?`<div class="mn">${esc(d[2])}</div><small>${esc(d[1])}</small>`:`<div class="wd">${esc(d[1])}</div><small>tap to flip</small>`}</div>
 <div class="row" style="margin-top:12px"><button id="pv">&larr; Prev</button><button id="kn" class="${known.has(k)?'p':''}">${known.has(k)?'✓ Known':'I know it'}</button><button id="nx" class="p">Next &rarr;</button></div>`;
 app.innerHTML=h;bindChips();bindF()}
function bindF(){
 const g=id=>document.getElementById(id);
 g('un').onclick=()=>{onlyUnk=!onlyUnk;build();flash()};
 g('sf').onclick=()=>{deck=sh(deck);i=0;flip=false;flash()};
 if(!deck.length)return;
 g('cd').onclick=()=>{flip=!flip;flash()};
 g('pv').onclick=()=>{i=(i-1+deck.length)%deck.length;flip=false;flash()};
 g('nx').onclick=()=>{i=(i+1)%deck.length;flip=false;flash()};
 g('kn').onclick=()=>{const k=deck[i];known.has(k)?known.delete(k):known.add(k);save();flash()}}
document.addEventListener('keydown',e=>{if(mode!='F'||!deck.length)return;
 if(e.key==' '){e.preventDefault();flip=!flip;flash()}
 else if(e.key=='ArrowRight'){i=(i+1)%deck.length;flip=false;flash()}
 else if(e.key=='ArrowLeft'){i=(i-1+deck.length)%deck.length;flip=false;flash()}});

// ---- Exam panel ----
let Q=[],qi=0,score=0,miss=[],answered=false;
function quiz(ids){
 ids=ids||D.map((d,k)=>k).filter(k=>grp==0||D[k][0]==grp);
 Q=sh(ids);qi=0;score=0;miss=[];answered=false;
 app.innerHTML=chips()+`<div class="card" style="cursor:default"><div class="mn">${Q.length} questions &middot; ${grp==0?'all words':'Group '+grp}</div><div class="row" style="margin-top:16px"><button class="p" id="go">Start exam</button></div></div>`;
 bindChips();
 document.getElementById('go').onclick=ask}
function ask(){
 if(qi>=Q.length)return done();
 const k=Q[qi],d=D[k];answered=false;
 const wrong=sh(D.map((x,j)=>j).filter(j=>j!=k&&D[j][2]!=d[2])).slice(0,3);
 const opts=sh([k,...wrong]);
 app.innerHTML=`<div class="mu">Question ${qi+1} / ${Q.length} &middot; Score ${score}</div><div class="bar"><i style="width:${qi/Q.length*100}%"></i></div>
 <div class="mu">What does this word mean?</div><div class="q">${esc(d[1])}</div><div id="os"></div><div id="nx2"></div>`;
 const os=document.getElementById('os');
 opts.forEach(j=>{const b=document.createElement('button');b.className='opt';b.textContent=D[j][2];
  b.onclick=()=>{if(answered)return;answered=true;
   const ok=j==k;if(ok)score++;else miss.push(k);
   [...os.children].forEach((c,x)=>{if(opts[x]==k)c.classList.add('c');else if(opts[x]==j)c.classList.add('x')});
   const n=document.getElementById('nx2');n.innerHTML=`<button class="p" id="nb">${qi+1>=Q.length?'Finish':'Next'} &rarr;</button>`;
   document.getElementById('nb').onclick=()=>{qi++;ask()}};
  os.appendChild(b)})}
function done(){
 const p=Math.round(score/Q.length*100);
 app.innerHTML=`<div class="card" style="cursor:default"><div class="wd">${score} / ${Q.length}</div><div class="mn">${p}%</div></div>
 <div class="row" style="margin-top:12px"><button class="p" id="ag">Retake</button>${miss.length?'<button id="rm">Retry missed ('+miss.length+')</button>':''}</div>
 ${miss.length?'<h3>Missed</h3><ul class="res">'+miss.map(k=>`<li><b>${esc(D[k][1])}</b> &ndash; ${esc(D[k][2])}</li>`).join('')+'</ul>':''}`;
 document.getElementById('ag').onclick=()=>quiz();
 const r=document.getElementById('rm');if(r)r.onclick=()=>quiz(miss.slice())}

start();
</script></body></html>
